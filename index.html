<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aptagrim HRMS</title>
<meta name="description" content="HRMS platform prototype — Admin, HR and Employee workspaces.">
<link rel="stylesheet" href="design-system/css/index.css">
<link rel="stylesheet" href="css/prototype.css">
</head>
<body>
<div id="root"></div>

<!-- React via UMD, so the prototype opens straight from the file system with no build step. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<!-- Design system -->
<script src="design-system/js/violet.js"></script>
<script src="design-system/js/icons.js"></script>

<!-- Application. Load order matters: data, then state, then IA, then views. -->
<script src="js/data/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/rules.js"></script>
<script src="js/actions.js"></script>
<script src="js/permissions.js"></script>
<script src="js/nav.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/perf.js"></script>
<script src="js/payroll.js"></script>
<script src="js/shell.js"></script>

<!-- Screens, one file per phase of PRD section 18. Each registers into HRMS.screens. -->
<script src="js/screens.js"></script>
<script src="js/screens/org.js"></script>
<script src="js/screens/people.js"></script>
<script src="js/screens/admin-people.js"></script>
<script src="js/screens/search.js"></script>
<script src="js/screens/setup.js"></script>
<script src="js/screens/roles.js"></script>
<script src="js/screens/time.js"></script>
<script src="js/screens/lifecycle.js"></script>
<script src="js/screens/compensation.js"></script>
<script src="js/screens/engagement.js"></script>
<script src="js/screens/insights.js"></script>
<script src="js/screens/self.js"></script>
<script src="js/screens/leave-portal.js"></script>
<script src="js/screens/perf-board.js"></script>
<script src="js/screens/payroll.js"></script>

<script src="js/app.js"></script>
</body>
</html>
